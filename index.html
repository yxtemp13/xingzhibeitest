<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-color: #111;
      --text-color: #f5f5f5;
      --panel-bg: rgba(255, 255, 255, 0.1);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #16213e, #0f3460);
      color: var(--text-color);
    }

    main {
      width: min(90vw, 600px);
      display: grid;
      gap: 1rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw + 1rem, 3rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    canvas {
      width: min(90vw, 600px);
      height: min(90vw, 600px);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .panel {
      display: grid;
      gap: 0.5rem;
      background: var(--panel-bg);
      padding: 1.5rem;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .panel strong {
      font-size: 1.2rem;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }

    button {
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: linear-gradient(120deg, #00adb5, #00ffb3);
      color: #041c32;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.3);
    }

    p {
      margin: 0;
      line-height: 1.6;
    }

    kbd {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 0.15rem;
      font-weight: 600;
    }

    footer {
      font-size: 0.85rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <main>
    <h1>贪吃蛇</h1>
    <canvas id="board" width="600" height="600" aria-label="贪吃蛇游戏画布"></canvas>

    <section class="panel" aria-live="polite">
      <strong id="score">得分：0</strong>
      <div class="btn-group">
        <button id="start">开始</button>
        <button id="pause">暂停</button>
        <button id="reset">重新开始</button>
      </div>
      <p>使用键盘 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 控制方向，避免撞到边界或自己的身体，吃到食物会增长长度并获得积分。</p>
    </section>

    <footer>
      © 2024 贪吃蛇小游戏
    </footer>
  </main>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const startBtn = document.getElementById('start');
    const pauseBtn = document.getElementById('pause');
    const resetBtn = document.getElementById('reset');

    const tileCount = 20;
    const tileSize = canvas.width / tileCount;
    const speedIncreaseStep = 5;
    const speedMultiplier = 0.85;

    let gameLoopId = null;
    let isRunning = false;
    let tickRate = 200;

    const defaultState = () => ({
      snake: [{ x: 10, y: 10 }],
      direction: { x: 0, y: 0 },
      food: spawnFood([{ x: 10, y: 10 }]),
      score: 0
    });

    let state = defaultState();

    function spawnFood(occupied) {
      let position;
      do {
        position = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (occupied.some(segment => segment.x === position.x && segment.y === position.y));
      return position;
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(
        (state.food.x + 0.5) * tileSize,
        (state.food.y + 0.5) * tileSize,
        tileSize / 2.5,
        0,
        Math.PI * 2
      );
      ctx.fill();

      state.snake.forEach((segment, index) => {
        const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, '#22d3ee');
        gradient.addColorStop(1, '#a855f7');
        ctx.fillStyle = gradient;
        ctx.fillRect(
          segment.x * tileSize + 2,
          segment.y * tileSize + 2,
          tileSize - 4,
          tileSize - 4
        );

        if (index === 0) {
          ctx.fillStyle = '#0f172a';
          const eyeSize = tileSize / 6;
          ctx.beginPath();
          ctx.arc(segment.x * tileSize + tileSize / 3, segment.y * tileSize + tileSize / 3, eyeSize, 0, Math.PI * 2);
          ctx.arc(segment.x * tileSize + (2 * tileSize) / 3, segment.y * tileSize + tileSize / 3, eyeSize, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function update() {
      const head = state.snake[0];
      const newHead = {
        x: head.x + state.direction.x,
        y: head.y + state.direction.y
      };

      if (state.direction.x === 0 && state.direction.y === 0) {
        return;
      }

      if (
        newHead.x < 0 ||
        newHead.y < 0 ||
        newHead.x >= tileCount ||
        newHead.y >= tileCount ||
        state.snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)
      ) {
        endGame();
        return;
      }

      state.snake.unshift(newHead);

      if (newHead.x === state.food.x && newHead.y === state.food.y) {
        state.score += 10;
        scoreEl.textContent = `得分：${state.score}`;
        state.food = spawnFood(state.snake);

        if (state.score % (speedIncreaseStep * 10) === 0) {
          tickRate = Math.max(60, tickRate * speedMultiplier);
          restartLoop();
        }
      } else {
        state.snake.pop();
      }
    }

    function loop() {
      update();
      draw();
    }

    function startGame() {
      if (isRunning) return;
      isRunning = true;
      restartLoop();
    }

    function restartLoop() {
      if (gameLoopId) {
        clearInterval(gameLoopId);
      }
      gameLoopId = setInterval(loop, tickRate);
    }

    function pauseGame() {
      isRunning = false;
      clearInterval(gameLoopId);
      gameLoopId = null;
    }

    function endGame() {
      pauseGame();
      scoreEl.textContent += ' — 游戏结束';
    }

    function resetGame() {
      pauseGame();
      tickRate = 200;
      state = defaultState();
      scoreEl.textContent = `得分：${state.score}`;
      draw();
    }

    function changeDirection({ key }) {
      const { x, y } = state.direction;
      if (key === 'ArrowUp' && y !== 1) {
        state.direction = { x: 0, y: -1 };
      } else if (key === 'ArrowDown' && y !== -1) {
        state.direction = { x: 0, y: 1 };
      } else if (key === 'ArrowLeft' && x !== 1) {
        state.direction = { x: -1, y: 0 };
      } else if (key === 'ArrowRight' && x !== -1) {
        state.direction = { x: 1, y: 0 };
      }
    }

    window.addEventListener('keydown', changeDirection);
    startBtn.addEventListener('click', () => {
      startGame();
    });
    pauseBtn.addEventListener('click', () => {
      pauseGame();
    });
    resetBtn.addEventListener('click', () => {
      resetGame();
      startGame();
    });

    draw();
  </script>
</body>
</html>
