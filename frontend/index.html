<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web 性能诊断工具</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <style>
      body { margin: 0; }
      main { padding: 1.5rem; }
      .chart-container { height: 320px; margin-bottom: 2rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 1.5rem; }
      .job-status { font-family: monospace; }
      header { background: #0f172a; color: white; padding: 1.5rem; }
      header h1 { margin: 0; font-size: 1.75rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>Web 性能诊断工具</h1>
      <p>监控、诊断与剖析一体化平台</p>
    </header>
    <main>
      <section>
        <h2>主机概览</h2>
        <div id="hosts" class="grid"></div>
      </section>
      <section>
        <h2>CPU 使用趋势</h2>
        <div id="cpu-chart" class="chart-container"></div>
      </section>
      <section>
        <h2>诊断任务</h2>
        <form id="job-form">
          <label>
            任务类型
            <select name="job_type">
              <option value="runqlen">运行队列长度</option>
              <option value="runqlat">调度等待延迟</option>
              <option value="offcputime">Off-CPU 阻塞</option>
              <option value="biolatency">块设备延迟</option>
            </select>
          </label>
          <label>
            目标主机
            <input name="target" value="demo-host-1" required />
          </label>
          <label>
            采集时长（秒）
            <input type="number" name="duration" value="30" min="5" max="600" required />
          </label>
          <button type="submit">启动任务</button>
        </form>
        <div id="jobs" class="job-status"></div>
      </section>
      <section>
        <h2>持续剖析</h2>
        <div id="profiles" class="grid"></div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
